[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-ad-slot"
version = "0.1.0"
description = "Find high-value ad placements and keywords for a website, then push a briefing to GitHub."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Quantum Research Laboratories LLC" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
deep-ad-slot = "deep_ad_slot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
