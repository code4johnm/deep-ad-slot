# Deep Ad Slot profile contract
# DAS-SSB-2026-001 / conf/profiles.yml
# Rebuild or pass explicit --profile (target). Not a hidden live toggle that
# weakens a tagged prod wheel. Developer-local overrides must not be packed
# into release artifacts (CM-6).
#
# Each security-relevant setting maps to a NIST SP 800-53 Rev. 5 control_id
# and a TEST-* id from docs/03-traceability-seed.csv.

