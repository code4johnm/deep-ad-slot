<!--
  Cooks Defense four-slot package for index.html.
  Only #cd-ad-mid is a live AdSense unit. Auto ads stay off.
  No numeric data-ad-slot is issued in this repo, so the attribute is omitted.
  Do not place these blocks on the logo, nav, ticker, hero CTAs, .alert-bar,
  911 / National Human Trafficking Hotline / text 233733, the contact form,
  privacy.html, terms.html, about.html, or contact.html.
-->

<!--
      House/sponsor only. Reserved leaderboard below the nav (100% × 90px). No adsbygoogle tag and no adsbygoogle.push. Not a live unit.
      Do-not-monetize: logo, primary nav, ticker, hero CTAs, .alert-bar, 911 / National Human Trafficking Hotline / text 233733, contact form, privacy.html, terms.html, about.html, contact.html.
    -->
    <div class="cd-ad cd-ad--leaderboard" id="cd-ad-nav" aria-label="Sponsored">
      <span class="cd-ad__label">Sponsored</span>
      <div class="cd-ad__slot"></div>
    </div>

<!--
      Single live AdSense review unit. 300×250 rectangle after services, before values. Client ca-pub-6397321536815225. No numeric data-ad-slot (none issued). Auto ads off.
      Do-not-monetize: logo, primary nav, ticker, hero CTAs, .alert-bar, 911 / National Human Trafficking Hotline / text 233733, contact form, privacy.html, terms.html, about.html, contact.html.
    -->
    <div class="cd-ad cd-ad--native" id="cd-ad-mid" aria-label="Sponsored">
      <span class="cd-ad__label">Sponsored</span>
      <div class="cd-ad__slot">
        <ins class="adsbygoogle"
             style="display:inline-block;width:300px;height:250px"
             data-ad-client="ca-pub-6397321536815225"
             data-ad-format="rectangle"></ins>
      </div>
    </div>

<!--
    House/sponsor only. Reserved horizontal footer band. No adsbygoogle tag and no adsbygoogle.push. Not a live unit.
    Do-not-monetize: logo, primary nav, ticker, hero CTAs, .alert-bar, 911 / National Human Trafficking Hotline / text 233733, contact form, privacy.html, terms.html, about.html, contact.html.
  -->
  <div class="cd-ad cd-ad--footer" id="cd-ad-footer" aria-label="Sponsored">
    <span class="cd-ad__label">Sponsored</span>
    <div class="cd-ad__slot"></div>
  </div>

<!--
    House/sponsor only. Closable reserved mobile bar (320×50), hidden on desktop. No adsbygoogle tag and no adsbygoogle.push. Not a live unit.
    The close control may hide this placeholder when it would cover hero CTAs, the contact form, or .alert-bar / 911 / National Human Trafficking Hotline / text 233733.
    Do-not-monetize: logo, primary nav, ticker, hero CTAs, .alert-bar, 911 / National Human Trafficking Hotline / text 233733, contact form, privacy.html, terms.html, about.html, contact.html.
  -->
  <div class="cd-ad cd-ad--anchor" id="cd-ad-mobile" aria-label="Sponsored">
    <span class="cd-ad__label">Sponsored</span>
    <div class="cd-ad__slot"></div>
    <button type="button" class="cd-ad__close" id="cd-ad-mobile-close" aria-label="Close sponsored message">&times;</button>
  </div>
