name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile modules
        run: python -m compileall -q src

      - name: CLI help
        run: python -m deep_ad_slot --help

      - name: Influence on sample bids
        run: python -m deep_ad_slot influence examples/bids.sample.csv
